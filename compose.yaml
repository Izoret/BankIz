services:
  db:
    image: postgres:15
    volumes:
      - ~/2data/BankIz:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${PG_PASSWD}
      POSTGRES_DB: bankiz

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bankiz
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - db
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://root:${PG_PASSWD}@db:5432/bankiz
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?We need a Master key!}
